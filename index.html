<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Show List</title><style>:root{--bg:#f4f0e8;--ink:#111;--line:#111;--muted:#666;--accent:#ff4f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px 22px}header{border-bottom:3px solid;padding-bottom:22px}h1{font-size:clamp(46px,10vw,110px);line-height:.85;letter-spacing:-.07em;text-transform:uppercase;margin:0}.dek{font-size:20px;max-width:650px;margin:24px 0}.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:40px}.city{border:2px solid;padding:24px;color:inherit;text-decoration:none;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.city:hover{background:#111;color:#fff}.city.disabled{opacity:.35;pointer-events:none}.city strong{font-size:32px}.tag{font:12px monospace;text-transform:uppercase}footer{margin-top:70px;border-top:1px solid;padding-top:18px;color:var(--muted)}</style></head><body><main class="wrap"><header><div class="tag">No algorithms · No sponsored placement</div><h1>The Show List</h1><p class="dek">A plain, searchable index of shows. Chronological by default. You decide what matters.</p></header><section class="cities"><a class="city" href="philly/"><strong>Philadelphia</strong><span>PHL + NJ + DE + Central PA →</span></a><div class="city disabled"><strong>New York</strong><span>Coming soon</span></div><div class="city disabled"><strong>Los Angeles</strong><span>Coming soon</span></div><div class="city disabled"><strong>San Francisco</strong><span>Coming soon</span></div></section><footer>THE SHOW LIST · Independent concert indexing.</footer></main></body></html>
